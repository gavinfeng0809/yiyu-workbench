<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一隅 · 个人工作台</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f5f3ec; --bg-soft:#eeebe0; --surface:#fffdf7; --surface-2:#f8f5ec;
  --ink:#1d1c18; --ink-2:#4f4d45; --muted:#8b887b; --line:#e4e0d2;
  --accent:#d97757; --accent-soft:rgba(217,119,87,.13);
  --green:#788c5d; --green-soft:rgba(120,140,93,.14);
  --blue:#6a9bcc; --blue-soft:rgba(106,155,204,.14);
  --red:#b5542d; --red-soft:rgba(181,84,45,.12);
  --gold:#c9a227; --gold-soft:rgba(201,162,39,.14);
  --shadow:0 1px 2px rgba(29,28,24,.05),0 10px 30px rgba(29,28,24,.07);
  --shadow-sm:0 1px 2px rgba(29,28,24,.06),0 4px 12px rgba(29,28,24,.05);
  --radius:18px; --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","STZhongsong","SimSun",serif;
}
[data-theme="dark"]{
  --bg:#131311; --bg-soft:#191917; --surface:#1e1e1b; --surface-2:#242422;
  --ink:#f1efe7; --ink-2:#c3c1b5; --muted:#84827a; --line:#2d2c27;
  --accent-soft:rgba(217,119,87,.2); --green-soft:rgba(120,140,93,.22);
  --blue-soft:rgba(106,155,204,.2); --red-soft:rgba(181,84,45,.22); --gold-soft:rgba(201,162,39,.2);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100dvh;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局骨架 ============ */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:26px 16px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand-seal{width:42px;height:42px;border-radius:12px;background:var(--red);color:#fdf8f2;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:700;box-shadow:var(--shadow-sm);flex:none}
.brand h1{font-size:17px;letter-spacing:.5px}
.brand p{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:2px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--ink-2);font-size:14.5px;position:relative;transition:background .2s,color .2s,transform .15s;text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{background:var(--surface-2);transform:translateX(2px)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--accent)}
.nav-item[data-mod="guoxue"].active{background:var(--red-soft);color:var(--red)}
.nav-item[data-mod="guoxue"].active::before{background:var(--red)}
.nav-item[data-mod="kids"].active{background:var(--green-soft);color:var(--green)}
.nav-item[data-mod="kids"].active::before{background:var(--green)}
.nav-item[data-mod="english"].active{background:var(--blue-soft);color:var(--blue)}
.nav-item[data-mod="english"].active::before{background:var(--blue)}
.side-foot{padding-top:16px;border-top:1px solid var(--line)}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:12px;color:var(--ink-2);font-size:14px;transition:background .2s}
.theme-btn:hover{background:var(--surface-2)}
.theme-btn svg{width:19px;height:19px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 34px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .crumb{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.topbar .date{font-size:13px;color:var(--muted)}
.topbar .m-theme{display:none;width:38px;height:38px;border-radius:10px;place-items:center;background:var(--surface);border:1px solid var(--line)}
.topbar .m-theme svg{width:18px;height:18px}
#view{padding:28px 34px 60px;max-width:1120px;width:100%;margin:0 auto}
.tabbar{display:none}

/* ============ 通用组件 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.fade-in{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec-title{font-size:18px;font-weight:700;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title svg{width:20px;height:20px;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(217,119,87,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(217,119,87,.4)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--muted);color:var(--ink)}
.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);transition:all .18s;user-select:none}
.chip:hover{border-color:var(--muted);transform:translateY(-1px)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1);z-index:99;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.progress{height:8px;border-radius:8px;background:var(--bg-soft);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),#e8997a);transition:width .5s cubic-bezier(.16,1,.3,1)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);transition:all .18s;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}

/* ============ 首页 ============ */
.hero{padding:30px 32px;background:linear-gradient(135deg,var(--surface),var(--surface-2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%)}
.hero h2{font-size:26px;letter-spacing:.5px}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);font-size:14px;margin-top:8px}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:18px}
.dash-card{padding:20px 22px;transition:transform .2s,box-shadow .25s;position:relative}
.dash-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dc-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.dc-head h3 svg{width:17px;height:17px}
.dc-head .more{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px}
.dc-head .more svg{width:13px;height:13px}
.dc-head .more:hover{color:var(--accent)}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.mini-money{display:flex;gap:10px}
.mini-money .mm{flex:1;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-2)}
.mm .k{font-size:12px;color:var(--muted)}
.mm .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.mm .v.out{color:var(--red)}.mm .v.in{color:var(--green)}
.quote-card{font-family:var(--serif)}
.quote-big{font-size:21px;line-height:1.9;font-weight:600}
.quote-src{margin-top:10px;font-size:13.5px;color:var(--muted);text-align:right}
.quote-actions{display:flex;justify-content:flex-end;margin-top:8px}
.learn-bars{display:flex;flex-direction:column;gap:16px}
.lb .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.lb .row b{font-variant-numeric:tabular-nums}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick{padding:18px 12px;text-align:center;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);transition:all .2s;width:100%}
.quick:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.quick .qi{width:42px;height:42px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center}
.quick .qi svg{width:21px;height:21px}
.quick span{font-size:13px;font-weight:600}
.qi.o{background:var(--accent-soft);color:var(--accent)}
.qi.r{background:var(--red-soft);color:var(--red)}
.qi.g{background:var(--green-soft);color:var(--green)}
.qi.b{background:var(--blue-soft);color:var(--blue)}

/* ============ 记账 ============ */
.money-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{padding:20px 22px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat .k svg{width:15px;height:15px}
.stat .v{font-size:27px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
.money-charts{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-top:16px}
.chart-card{padding:20px 22px}
.chart-card h4{font-size:14.5px;font-weight:700;margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut-wrap svg{width:150px;height:150px;flex:none}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .dot{width:10px;height:10px;border-radius:4px;flex:none}
.legend .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pc{color:var(--muted);font-variant-numeric:tabular-nums}
.bars{width:100%}
.add-form{margin-top:16px;padding:22px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 22px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s}
.seg button.on-out{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(181,84,45,.35)}
.seg button.on-in{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(120,140,93,.35)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.form-grid .full{grid-column:1/-1}
.f-label{font-size:12.5px;color:var(--muted);margin-bottom:7px;display:block}
.records{margin-top:16px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:110px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.day-group{margin-bottom:6px}
.day-head{display:flex;justify-content:space-between;padding:14px 6px 8px;font-size:12.5px;color:var(--muted)}
.rec{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.rec:last-child{border-bottom:none}
.rec:hover{background:var(--surface-2)}
.rec .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.rec .info{flex:1;min-width:0}
.rec .cat{font-size:14.5px;font-weight:600}
.rec .note{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rec .amt{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .amt.out{color:var(--red)}.rec .amt.in{color:var(--green)}
.rec .del{opacity:0}
.rec:hover .del{opacity:1}

/* ============ 国学 ============ */
.daily-quote{padding:34px 36px;font-family:var(--serif);background:linear-gradient(120deg,var(--surface),var(--surface-2));position:relative;overflow:hidden}
.daily-quote::before{content:"每日一句";position:absolute;top:18px;right:24px;font-size:12px;letter-spacing:4px;color:var(--muted)}
.daily-quote .dq{font-size:24px;line-height:2;font-weight:600}
.daily-quote .ds{margin-top:12px;font-size:14px;color:var(--muted);text-align:right}
.classic-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.classic-item{padding:20px 22px;display:flex;gap:16px;align-items:flex-start;transition:all .2s;text-align:left;width:100%}
.classic-item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.classic-item .ci-seal{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-size:19px;font-weight:700;color:#fff;flex:none}
.classic-item h4{font-size:15.5px;font-weight:700}
.classic-item .meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.classic-item .intro{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.read-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.read-head h2{font-family:var(--serif);font-size:23px;flex:1}
.font-ctl{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.font-ctl button{padding:5px 11px;font-size:13px;border-radius:8px;color:var(--ink-2)}
.font-ctl button:hover{background:var(--surface)}
.reader{padding:36px 42px;font-family:var(--serif)}
.reader .r-title{text-align:center;font-size:26px;font-weight:700;letter-spacing:2px}
.reader .r-author{text-align:center;color:var(--muted);font-size:14.5px;margin-top:10px;letter-spacing:1px}
.reader .r-body{margin-top:30px;line-height:2.15;white-space:pre-wrap}
.reader .r-body.poem{text-align:center;line-height:2.3}
.fav-mark.on{color:var(--gold)}

/* ============ 启蒙 & 英语 ============ */
.learn-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.learn-progress{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 18px}
.learn-progress .txt{font-size:13px;color:var(--ink-2);white-space:nowrap}
.learn-progress .progress{flex:1}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.flip{perspective:900px;height:170px;position:relative}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.2,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.face .zi{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1}
.face .py{font-size:15px;color:var(--accent);font-weight:600}
.face .wd{font-size:13px;color:var(--ink-2)}
.face .num-big{font-size:46px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.face .dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100px;margin-top:6px}
.face .dots i{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.card-tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}
.card-tools .icon-btn{width:30px;height:30px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
.card-tools .icon-btn.done{color:var(--green);background:var(--green-soft)}
.color-tile{height:130px;border-radius:var(--radius);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.color-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.color-tile .cn{font-size:19px;font-weight:700}
.color-tile .en{font-size:12.5px;opacity:.85;margin-top:2px}
.py-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.py-cell{padding:16px 8px;text-align:center;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);font-size:18px;font-weight:600;transition:all .18s;cursor:pointer}
.py-cell:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
.py-cell small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.group-label{font-size:14px;font-weight:700;margin:20px 0 10px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.wflip{perspective:900px;height:168px;position:relative}
.wface .word{font-size:24px;font-weight:800;letter-spacing:.5px}
.wface .phon{font-size:13.5px;color:var(--muted);margin-top:4px}
.wface .mean{font-size:19px;font-weight:700}
.wface .ex{font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.7;margin-top:8px}
.wface .ex i{display:block;font-style:normal;color:var(--muted)}
.daily-word{padding:24px 26px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:18px;background:linear-gradient(120deg,var(--surface),var(--surface-2))}
.daily-word .dw-main{flex:1;min-width:200px}
.daily-word .dw-tag{font-size:11px;letter-spacing:3px;color:var(--muted)}
.daily-word .dw-word{font-size:30px;font-weight:800;margin-top:6px}
.daily-word .dw-phon{color:var(--muted);font-size:14px;margin-top:4px}
.daily-word .dw-mean{font-size:16px;margin-top:8px;color:var(--ink-2)}
.daily-word .dw-ex{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}

/* ============ 响应式 ============ */
@media (max-width:960px){
  .money-charts{grid-template-columns:1fr}
  .dash-grid>.span-4,.dash-grid>.span-5,.dash-grid>.span-6,.dash-grid>.span-7,.dash-grid>.span-8{grid-column:span 12}
  .classic-list{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:14px 18px}
  .topbar .m-theme{display:grid}
  #view{padding:20px 16px 110px}

const Money={
  list(){return store.get('expenses',[])},
  save(l){store.set('expenses',l)},
  add(rec){const l=this.list();l.unshift(rec);this.save(l)},
  del(id){this.save(this.list().filter(r=>r.id!==id))},
  byMonth(m){return this.list().filter(r=>r.date.startsWith(m))},
  sum(list,type){return list.filter(r=>r.type===type).reduce((s,r)=>s+r.amount,0)}
};

  App.moneyMonth=monthStr(d);renderMoney($('#view'));

function monthLabel(m){const [y,mm]=m.split('-');return `${y}年${Number(mm)}月`}

function donutSVG(parts){
  const total=parts.reduce((s,p)=>s+p.v,0);
  if(total<=0)return '';
  let off=25;
  const segs=parts.map(p=>{
    const pc=p.v/total*100;
    const s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${p.color}" stroke-width="4.5" stroke-dasharray="${pc.toFixed(2)} 100" stroke-dashoffset="${off.toFixed(2)}"/>`;
    off=(off-pc+100)%100;return s;
  }).join('');
  return `<svg viewBox="0 0 42 42">${segs}<text x="21" y="20" text-anchor="middle" font-size="4.6" fill="var(--ink)" font-weight="700">${fmt(total).replace('¥','')}</text><text x="21" y="25.5" text-anchor="middle" font-size="2.6" fill="var(--muted)">总支出</text></svg>`;
}
function barsSVG(days){
  const max=Math.max(...days.map(d=>d.v),1);
  const W=560,bw=W/days.length;
  const bars=days.map((d,i)=>{
    const h=Math.max(d.v/max*120,d.v>0?3:1);
    const x=i*bw+bw*.22,w=bw*.56,y=132-h;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${d.v>0?'var(--accent)':'var(--line)'}"><title>${d.label} ${fmt(d.v)}</title></rect>
      <text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-weight="600">${d.v>0?(d.v>=10000?(d.v/10000).toFixed(1)+'w':Math.round(d.v)):''}</text>
      <text x="${x+w/2}" y="150" text-anchor="middle" font-size="11" fill="var(--muted)">${d.label}</text>`;
  }).join('');
  return `<svg class="bars" viewBox="0 0 ${W} 160">${bars}</svg>`;
}

/* ================================================================
   模块三：国学经典
   ================================================================ */
function renderGuoxue(view){
  if(App.gxReading){renderReader(view);return}
  const q=dailyQuote();
  const cats=['全部',...new Set(CLASSICS.map(c=>c.cat))];
  const favs=Progress.favs();
  const list=CLASSICS.filter(c=>App.gxCat==='全部'||c.cat===App.gxCat);
  view.innerHTML=`
  <div class="daily-quote card fade-in">
    <div class="dq">${esc(q[0])}</div>
    <div class="ds">—— ${esc(q[1])}
      <button class="icon-btn" onclick="event.stopPropagation();rerollQuote()" title="换一句" style="vertical-align:middle;margin-left:6px">${icon('refresh')}</button>
    </div>
  </div>
  <h3 class="sec-title">${icon('book')} 经典文库</h3>
  <div class="chips" style="margin-bottom:16px">${cats.map(c=>`<button class="chip ${App.gxCat===c?'on':''}" onclick="setGxCat('${c}')">${c}</button>`).join('')}</div>
  <div class="classic-list">
    ${list.map(c=>`<button class="classic-item card fade-in" onclick="openClassic('${c.id}')">
      <div class="ci-seal" style="background:${c.color}">${c.seal}</div>
      <div style="flex:1;min-width:0">
        <h4>${esc(c.title)} ${favs.has(c.id)?icon('star','width:14px;height:14px;color:var(--gold);vertical-align:-1px'):''}</h4>
        <div class="meta">${esc(c.author)} · ${c.cat}</div>
        <div class="intro">${esc(c.intro)}</div>
      </div>
    </button>`).join('')}
  </div>`;
}
window.setGxCat=c=>{App.gxCat=c;renderGuoxue($('#view'))};
window.rerollQuote=function(){
  const dq=$('.daily-quote .dq'),ds=$('.daily-quote .ds');
  let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(QUOTES[i][0]===dq.textContent);
  dq.textContent=QUOTES[i][0];
  ds.firstChild.textContent='—— '+QUOTES[i][1];
};
window.openClassic=id=>{App.gxReading=id;location.hash='#/guoxue/'+id;render()};
window.closeClassic=()=>{App.gxReading=null;location.hash='#/guoxue';render()};
window.gxFont=d=>{App.gxFont=Math.min(24,Math.max(14,App.gxFont+d));const b=$('.r-body');if(b)b.style.fontSize=App.gxFont+'px'};
window.toggleFav=id=>{const on=Progress.favToggle(id);toast(on?'已收藏':'已取消收藏');renderGuoxue($('#view'))};
window.togglePinyin=()=>{App.showPinyin=!App.showPinyin;renderReader($('#view'))};
window.readFull=function(){
  const c=CLASSICS.find(x=>x.id===App.gxReading);
  if(!c)return;
  if(c.full&&CLASSICS_FULL[c.linesKey]){
    const text=CLASSICS_FULL[c.linesKey].lines.map(l=>l.t).join('。');
    speak(text,'zh-CN',0.75);
  }else{
    speak(c.body,'zh-CN',0.7);
  }
};

function renderReader(view){
  const c=CLASSICS.find(x=>x.id===App.gxReading);
  if(!c){App.gxReading=null;renderGuoxue(view);return}
  const fav=Progress.favs().has(c.id);
  /* 全文模式：有 lines 数据则用 ruby 拼音渲染 */
  let bodyHtml='';
  if(c.full&&CLASSICS_FULL[c.linesKey]){
    const cf=CLASSICS_FULL[c.linesKey];
    const pyCls=App.showPinyin?'':'no-pinyin';
    /* 每 2 行一组（对联/上下句），三字经每 4 句一组 */
    const isSzj=c.linesKey==='szj';
    const groupSz=isSzj?4:2;
    const lines=cf.lines;
    let groups=[];
    for(let i=0;i<lines.length;i+=groupSz){
      groups.push(lines.slice(i,i+groupSz));
    }
    bodyHtml=`<div class="r-body ${pyCls}" style="font-size:${App.gxFont}px">
      ${groups.map(g=>`<div class="r-line">${g.map(l=>{
        /* 拆出每个汉字对应拼音 */
        const chars=l.t.replace(/[，。、；：！？""''（）\s]/g,'').split('');
        const pys=l.p.split(/\s+/);
        let rubys=chars.map((ch,i)=>{
          const py=pys[i]||'';
          return py?`<ruby>${ch}<rt>${py}</rt></ruby>`:`<span>${ch}</span>`;
        }).join('');
        /* 保留标点：重新拼入原句中标点 */
        let result='',ci=0,pi=0;
        for(let k=0;k<l.t.length;k++){
          const ch=l.t[k];
          if(/[，。、；：！？""''（）\s]/.test(ch)){result+=ch}
          else{result+=pys[pi]?`<ruby>${ch}<rt>${pys[pi]}</rt></ruby>`:`<span>${ch}</span>`;pi++}
        }
        return result;
      }).join('')}</div>`).join('')}
    </div>`;
  }else{
    bodyHtml=`<div class="r-body ${c.poem?'poem':''}" style="font-size:${App.gxFont}px">${esc(c.body)}</div>`;
  }
  /* 拼音切换按钮 + 全文朗读按钮（仅全文模式显示） */
  const pyBtn=c.full?`<button class="icon-btn" onclick="togglePinyin()" title="拼音开关" style="width:38px;height:38px;font-size:13px;font-weight:700">${App.showPinyin?'拼':'拼✕'}</button>`:'';
  const readBtn=c.full?`<button class="icon-btn" onclick="readFull()" title="全文朗读" style="width:38px;height:38px">${icon('vol')}</button>`:`<button class="icon-btn" onclick="speak(this.dataset.t,'zh-CN',0.7)" data-t="${esc(c.title)}" title="朗读标题" style="width:38px;height:38px">${icon('vol')}</button>`;
  view.innerHTML=`
  <div class="read-head fade-in">
    <button class="btn btn-ghost" onclick="closeClassic()">${icon('back')} 返回文库</button>
    <h2>${esc(c.title)}</h2>
    <div class="font-ctl"><button onclick="gxFont(-1)">A−</button><button onclick="gxFont(1)">A＋</button></div>
    ${pyBtn}
    <button class="icon-btn fav-mark ${fav?'on':''}" onclick="toggleFav('${c.id}')" title="收藏" style="width:38px;height:38px">${icon('star')}</button>
    ${readBtn}
  </div>
  <div class="reader card fade-in" style="animation-delay:.05s">
    <div class="r-title">${esc(c.title)}</div>
    <div class="r-author">${esc(c.author)}</div>
    ${c.full&&CLASSICS_FULL[c.linesKey]?`<div class="r-intro" style="font-size:13px;color:var(--muted);margin-bottom:12px">${esc(CLASSICS_FULL[c.linesKey].intro)}</div>`:''}
    ${bodyHtml}
  </div>`;
}

/* ================================================================

   ================================================================ */
const KID_TOTAL=HANZI.length+20+COLORS.length;
function renderKids(view){

  view.innerHTML=`
  <div class="learn-progress card fade-in">
    <span class="txt">学习进度 <b>${done.size}</b> / ${KID_TOTAL}</span>
    <div class="progress"><i style="width:${Math.round(done.size/KID_TOTAL*100)}%;background:linear-gradient(90deg,var(--green),#9ab57e)"></i></div>
  </div>
  <div class="learn-tabs">${tabs.map(t=>`<button class="chip ${App.kidsTab===t[0]?'on':''}" onclick="setKidsTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
  <div id="kidsBody"></div>`;
  const body=$('#kidsBody');
  if(App.kidsTab==='hanzi'){
    body.innerHTML=`<div class="card-grid">${HANZI.map((h,i)=>`
      <div class="flip" data-zi="${h[0]}">
        <div class="card-tools">
          <button class="icon-btn" onclick="event.stopPropagation();speak('${h[0]}，${h[2]}')" title="读一读">${icon('vol')}</button>
          <button class="icon-btn kdone ${done.has(h[0])?'done':''}" onclick="event.stopPropagation();toggleKid(this,'${h[0]}')" title="学会了">${icon('check')}</button>
        </div>
        <div class="flip-inner" onclick="this.parentElement.classList.toggle('flipped')">
          <div class="face"><div class="zi">${h[0]}</div></div>
          <div class="face back"><div class="py">${h[1]}</div><div class="zi" style="font-size:34px">${h[0]}</div><div class="wd">${h[2]}</div></div>
        </div>
      </div>`).join('')}</div>`;
  }else if(App.kidsTab==='numbers'){
    body.innerHTML=`<div class="card-grid">${Array.from({length:20},(_,i)=>i+1).map(n=>`
      <div class="flip" data-zi="num${n}">
        <div class="card-tools">
          <button class="icon-btn" onclick="event.stopPropagation();speak('${NUM_WORDS[n]}')" title="读一读">${icon('vol')}</button>
          <button class="icon-btn kdone ${done.has('num'+n)?'done':''}" onclick="event.stopPropagation();toggleKid(this,'num${n}')" title="学会了">${icon('check')}</button>
        </div>
        <div class="flip-inner" onclick="this.parentElement.classList.toggle('flipped')">
          <div class="face"><div class="num-big">${n}</div>
            <div class="dots">${'<i></i>'.repeat(Math.min(n,10))}${n>10?'<i style="background:var(--red)"></i>'.repeat(n-10):''}</div></div>
          <div class="face back"><div class="zi" style="font-size:38px">${NUM_WORDS[n]}</div><div class="py">${NUM_EN[n]}</div></div>
        </div>
      </div>`).join('')}</div>`;
  }else if(App.kidsTab==='colors'){
    body.innerHTML=`<div class="card-grid">${COLORS.map(c=>`
      <div class="color-tile" style="background:${c[3]};color:${c[4]}" data-zi="color${c[0]}" onclick="speak('${c[0]}');this.style.transform='scale(.97)';setTimeout(()=>this.style.transform='',150)">
        <div class="card-tools">
          <button class="icon-btn kdone ${done.has('color'+c[0])?'done':''}" style="color:${c[4]}" onclick="event.stopPropagation();toggleKid(this,'color${c[0]}')" title="认识了">${icon('check')}</button>
        </div>
        <div class="cn">${c[0]}</div>
        <div class="en">${c[1]} · ${c[2]}</div>
      </div>`).join('')}</div>
      <p style="margin-top:14px;font-size:13px;color:var(--muted)">点一点色块，听听颜色怎么读。</p>`;
  }else{
    body.innerHTML=Object.entries(PINYIN).map(([g,list])=>`
      <div class="group-label">${g}</div>
      <div class="py-grid">${list.map(p=>`<button class="py-cell" onclick="speak('${p}')">${p}<small>点我读</small></button>`).join('')}</div>
    `).join('');
  }
}
window.setKidsTab=t=>{App.kidsTab=t;renderKids($('#view'))};
window.toggleKid=function(btn,key){
  const on=Progress.kidsToggle(key);
  btn.classList.toggle('done',on);
  const done=Progress.kids();
  const lp=$('.learn-progress');
  if(lp){lp.querySelector('.txt b').textContent=done.size;lp.querySelector('.progress i').style.width=Math.round(done.size/KID_TOTAL*100)+'%'}
  if(on)toast('太棒了，又学会一个');
};
