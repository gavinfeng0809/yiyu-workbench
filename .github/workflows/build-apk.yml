name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and project dependencies
      run: |
        npm install -g cordova@latest
        npm install

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Prepare www/ directory
      run: |
        rm -rf www
        mkdir -p www
        cp src/index.html www/index.html
        cp src/pinyin_data.js www/pinyin_data.js

    - name: Adapt index.html for Cordova
      run: |
        INDEX="www/index.html"
        # Add cordova.js before </head>
        sed -i 's|</head>|<script src="cordova.js"></script>\n</head>|' "$INDEX"
        # Remove PWA manifest links
        sed -i '/<link rel="manifest"/d' "$INDEX"
        sed -i '/<link rel="apple-touch-icon"/d' "$INDEX"
        # Replace init IIFE with deviceready listener
        sed -i 's|^(function init(){|function initApp(){|' "$INDEX"
        sed -i 's|if(.serviceWorker. in navigator)|/* SW skipped in Cordova */|' "$INDEX"
        # Replace closing })(); with deviceready logic
        perl -i -0pe 's/\}\)\(\);\s*\n<\/script>/}\n  if(typeof cordova!=="undefined"){document.addEventListener("deviceready",initApp,false)}else{initApp()}\n<\/script>/' "$INDEX"

    - name: Add Android platform
      run: cordova platform add android@13 --save

    - name: Build APK
      run: cordova build android --no-telemetry

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: yiyu-workbench-apk
        path: platforms/android/app/build/outputs/apk/**/*.apk
        retention-days: 30
